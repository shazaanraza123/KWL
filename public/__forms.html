<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>forms</title></head>
  <body>
    <!-- Netlify Forms detection only. The live form is components/ContactForm.tsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="subject" value="KWL Studio · new message (%{submissionId})" />
      <input name="bot-field" />
      <input name="name" />
      <input name="inquiry" />
      <input name="colorway" />
      <input name="size" />
      <input name="jean_size" />
      <input name="suggested_size" />
      <input name="company" />
      <input name="order_number" />
      <input name="contact_method" />
      <input name="contact" />
      <input name="email" />
      <textarea name="notes"></textarea>
    </form>
  </body>
</html>
